name: Book (GitHub Pages)

# Builds book/ with mdBook, verifies every code anchor against the pinned commit,
# and deploys to GitHub Pages. Scoped to book/ so it never fires on runtime changes.

on:
  push:
    branches:
      - main
      - claude/sglang-book-outline-argp1n
    paths:
      - "book/**"
      - ".github/workflows/book-pages.yml"
  pull_request:
    paths:
      - "book/**"
      - ".github/workflows/book-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer commit cancel an in-flight build, but never interrupt a live deploy.
concurrency:
  group: book-pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.4.40"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The anchor checker reads files out of the pinned commit, so the shallow
          # default clone is not enough.
          fetch-depth: 0

      - name: Verify code anchors against the pinned commit
        run: python3 book/scripts/verify_anchors.py

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: mdbook build book

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/output

  deploy:
    # Pull requests build and verify, but only pushes publish.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
