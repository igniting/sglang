name: Book (GitHub Pages)

# Builds book/ with mdBook, verifies every code anchor against the pinned commit,
# and publishes the static site to the gh-pages branch. Scoped to book/ so it never
# fires on runtime changes.

on:
  push:
    branches:
      - main
      - claude/sglang-book-outline-argp1n
    paths:
      - "book/**"
      - ".github/workflows/book-pages.yml"
  pull_request:
    paths:
      - "book/**"
      - ".github/workflows/book-pages.yml"
  workflow_dispatch:

# Pushing the built site to gh-pages needs write access to contents.
permissions:
  contents: write

concurrency:
  group: book-pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.4.40"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The anchor checker reads files out of the pinned commit, so the shallow
          # default clone is not enough.
          fetch-depth: 0

      - name: Verify code anchors against the pinned commit
        run: python3 book/scripts/verify_anchors.py

      # Regenerating must be a no-op: a figure edited by hand, or a layout whose
      # text no longer fits its box, fails here rather than in the reader's browser.
      - name: Verify figure geometry
        run: |
          python3 book/scripts/diagrams.py
          git diff --exit-code -- book/src || {
            echo "::error::Figures are stale — run python3 book/scripts/diagrams.py"
            exit 1
          }

      # Objectives and summary cards are generated, including the reading time,
      # so an edited chapter must not leave them describing the old one.
      - name: Verify chapter furniture
        run: python3 book/scripts/furniture.py --check

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: mdbook build book

      # Pull requests build and verify, but only pushes publish.
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # .nojekyll stops GitHub Pages running Jekyll over the output, which would
          # drop mdBook's asset directories.
          touch book/output/.nojekyll
          cd book/output
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy book from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "Published to https://$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f1).github.io/$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f2)/"
