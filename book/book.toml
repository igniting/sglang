[book]
title = "SGLang Internals"
description = "How a production LLM serving engine works, told by following one request through it."
authors = ["Anshu Avinash"]
language = "en"
src = "src"

[build]
build-dir = "output"
create-missing = false

# Rewrites `path/to/file.py:123` references into links at the pinned commit.
[preprocessor.linkify]
command = "python3 book/scripts/linkify_anchors.py"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/custom.css"]
additional-js = ["theme/calculators.js"]
git-repository-url = "https://github.com/igniting/sglang"
edit-url-template = "https://github.com/igniting/sglang/edit/claude/sglang-book-outline-argp1n/book/{path}"
no-section-label = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true

[output.html.print]
enable = true
